# Face-Auth — servicios locales
# Puertos host: BACKEND_PORT / FRONTEND_PORT / POSTGRES_PORT en `.env`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-faceauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-faceauth}
      POSTGRES_DB: ${POSTGRES_DB:-faceauth}
    ports:
      # Host ← POSTGRES_PORT; dentro de la red Docker el servicio sigue en :5432
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - faceauth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      # Dentro de Compose el backend habla con db:5432 (no el puerto publicado al host).
      DATABASE_URL: postgres://${POSTGRES_USER:-faceauth}:${POSTGRES_PASSWORD:-faceauth}@db:5432/${POSTGRES_DB:-faceauth}
      BACKEND_PORT: ${BACKEND_PORT:-8000}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    # entrypoint.sh ya corre download_ml_models + migrate (necesario: el bind-mount
    # pisa los pesos del build en instalaciones frescas).
    command: >
      sh -c "gunicorn config.wsgi:application --bind 0.0.0.0:$$BACKEND_PORT --reload --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      # Pasan tal cual desde el .env raíz (no reconstruir con localhost fijo).
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
      FRONTEND_ALLOWED_HOSTS: ${FRONTEND_ALLOWED_HOSTS:-}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "bun run dev -- --host 0.0.0.0 --port $$FRONTEND_PORT"

volumes:
  faceauth_pgdata:
