# Face-Auth — servicios locales
# Puertos host configurables vía BACKEND_PORT / FRONTEND_PORT en `.env`.
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: faceauth
      POSTGRES_PASSWORD: faceauth
      POSTGRES_DB: faceauth
    ports:
      - "5433:5432"
    volumes:
      - faceauth_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceauth -d faceauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://faceauth:faceauth@db:5432/faceauth
      BACKEND_PORT: ${BACKEND_PORT:-8000}
      CORS_ALLOWED_ORIGINS: http://localhost:${FRONTEND_PORT:-5173},http://127.0.0.1:${FRONTEND_PORT:-5173}
    ports:
      - "${BACKEND_PORT:-8000}:${BACKEND_PORT:-8000}"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:$$BACKEND_PORT --reload --workers 2"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      FRONTEND_PORT: ${FRONTEND_PORT:-5173}
      VITE_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
    ports:
      - "${FRONTEND_PORT:-5173}:${FRONTEND_PORT:-5173}"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    command: sh -c "bun run dev -- --host 0.0.0.0 --port $$FRONTEND_PORT"

volumes:
  faceauth_pgdata:
