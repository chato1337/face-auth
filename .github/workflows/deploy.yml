name: Deploy zbox

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: [self-hosted, zbox]
    steps:
      - name: Pull and recreate
        working-directory: /home/chatuz/develop/face-auth
        run: |
          git fetch origin
          git pull --ff-only
          docker compose up -d --build