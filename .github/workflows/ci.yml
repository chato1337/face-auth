name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: faceauth
          POSTGRES_PASSWORD: faceauth
          POSTGRES_DB: faceauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U faceauth -d faceauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DATABASE_URL: postgres://faceauth:faceauth@localhost:5432/faceauth
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake libgl1 libglib2.0-0
      - name: Install pipenv + deps
        run: |
          pip install pipenv
          pipenv install --dev --deploy
      - name: Migrate
        run: pipenv run python manage.py migrate --noinput
      - name: Lint (ruff)
        run: pipenv run ruff check .
      - name: Tests + coverage
        run: |
          pipenv run pytest \
            --cov=apps --cov=core \
            --cov-report=term-missing \
            --cov-report=xml \
            -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.10"
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run test
      - run: bun run build
